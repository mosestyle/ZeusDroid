# Lives on the "apk" branch as .github/workflows/release-apk.yml (copied there by
# tools/release/publish_apk.sh). A push to "apk" with a new release/ folder creates the
# GitHub release v<version> with the APK attached, tagged at the source commit on main.
name: Release APK
on:
  push:
    branches: [apk]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(cat release/version.txt)
          sha=$(cat release/commit.txt)
          tag="v$ver"
          # Old releases replaced by this one (tag and release removed).
          if [ -f release/replaces.txt ]; then
            while read -r old; do
              [ -n "$old" ] || continue
              gh release delete "$old" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            done < release/replaces.txt
          fi
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists already"; exit 0
          fi
          if ! out=$(gh release create "$tag" release/*.apk -R "$GITHUB_REPOSITORY" \
                --target "$sha" --title "ZeusDroid $ver" \
                --notes-file release/notes.md --latest 2>&1); then
            echo "::error::release failed: $out"
            exit 1
          fi
          echo "$out"
