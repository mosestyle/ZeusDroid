plugins {
    id 'com.android.application'
}

android {
    namespace 'org.zeusport.game'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.zeusport.game'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-dev'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signing config intentionally not committed (no private keys in git).
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path '../../engine/CMakeLists.txt'
            version '3.22.1+'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}
